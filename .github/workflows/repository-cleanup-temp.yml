name: Requested NaplFoam cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-cleanup-temp.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete compile-only branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/openfoam7-compile"
      - name: Delete stored Actions artifacts and caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' || true)
          if [ -n "$ids" ]; then
            while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            done <<< "$ids"
          fi
          gh cache delete --all --confirm || true
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/repository-cleanup-temp.yml
          git add -A
          git commit -m 'Finalize NaplFoam storage cleanup' || exit 0
          git push
